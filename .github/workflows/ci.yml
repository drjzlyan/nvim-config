name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stylua
        run: brew install stylua

      - name: Run stylua check
        run: stylua --check lua/

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Run shellcheck on scripts
        run: shellcheck scripts/*.sh

      - name: Verify lazy-lock.json is committed
        run: |
          if [[ ! -f lazy-lock.json ]]; then
            echo "lazy-lock.json is missing"
            exit 1
          fi
          echo "lazy-lock.json present"

  startup:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        run: brew install neovim

      - name: Bootstrap lazy.nvim plugins
        run: |
          mkdir -p ~/.config
          ln -s "$PWD" ~/.config/nvim
          nvim --headless "+Lazy! sync" +qa 2>&1 || true

      - name: Verify startup
        run: |
          nvim --headless --startuptime /tmp/startup.log -c 'qa' 2>&1
          tail -5 /tmp/startup.log

      - name: Verify health checks
        run: |
          nvim --headless -c 'checkhealth ide' -c 'qa' 2>&1 || true
          nvim --headless -c 'DevHealth' -c 'qa' 2>&1 || true
